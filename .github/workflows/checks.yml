name: Design checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  erc-drc:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: ERC
        run: kicad-cli sch erc --exit-code-violations --output erc.rpt NESRGB_AV_MultiOut.kicad_sch

      - name: DRC
        run: kicad-cli pcb drc --exit-code-violations --output drc.rpt NESRGB_AV_MultiOut.kicad_pcb

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-drc-reports
          path: |
            erc.rpt
            drc.rpt
