name: Fabrication outputs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fab:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: ERC / DRC
        run: |
          kicad-cli sch erc --exit-code-violations --output erc.rpt NESRGB_AV_MultiOut.kicad_sch
          kicad-cli pcb drc --exit-code-violations --output drc.rpt NESRGB_AV_MultiOut.kicad_pcb

      - name: Generate fabrication files
        run: ./scripts/export-fab.sh --version "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fab-${{ github.ref_name }}
          path: fab/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fab/NESRGB_AV_MultiOut-*-JLCPCB.zip
            fab/BOM.csv
            fab/images/*.png
